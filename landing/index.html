<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specview — Engineering Specs from Braindumps</title>

  <meta name="description" content="Turn your braindump into a full engineering spec set in under a minute.">
  <meta property="og:title" content="Specview — Engineering Specs from Braindumps">
  <meta property="og:description" content="Turn your braindump into a full engineering spec set in under a minute.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFFEF9;
      --ink: #121212;
      --ink-light: #5A5A5A;
      --red: #C41E3A;
      --serif: 'Playfair Display', Georgia, serif;
      --body: 'Source Serif 4', Georgia, serif;
      --sans: 'Source Sans 3', system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #141414;
      --ink: #E8E6E0;
      --ink-light: #A0A0A0;
      --red: #E05A72;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 80px 40px;
      max-width: 760px;
      margin: 0 auto;
    }
    .hero-overline {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 16px;
    }
    .hero-headline {
      font-family: var(--serif);
      font-size: 56px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 24px;
    }
    .hero-subline {
      font-family: var(--body);
      font-size: 18px;
      line-height: 1.75;
      color: var(--ink-light);
      margin-bottom: 36px;
      max-width: 520px;
    }
    .hero-cta {
      display: inline-block;
      background: var(--ink);
      color: var(--bg);
      border: 1px solid var(--ink);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 28px;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .hero-cta:hover { opacity: 0.8; }
    @media (max-width: 768px) {
      .hero { padding: 48px 20px; min-height: 100svh; }
      .hero-headline { font-size: 38px; }
      .hero-subline { font-size: 16px; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <span class="hero-overline">Engineering Specs</span>
    <h1 class="hero-headline">Write messy.<br>Ship clean.</h1>
    <p class="hero-subline">Paste your braindump. Five engineering documents back in under a minute.</p>
    <a class="hero-cta" href="https://app.specview.dev/">Open the app</a>
  </section>

<script>
  var saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
</script>
</body>
</html>
