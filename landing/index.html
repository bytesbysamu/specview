<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specview — Engineering Specs from Braindumps</title>

  <meta name="description" content="Turn your braindump into a full engineering spec set in under a minute.">
  <meta property="og:title" content="Specview — Engineering Specs from Braindumps">
  <meta property="og:description" content="Turn your braindump into a full engineering spec set in under a minute.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tokens.css">

  <style>
    /* ── Page shell ── */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* dynamic viewport height for mobile browsers */
      padding: 0;
      box-sizing: border-box;
    }

    /* ── Masthead ── */
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .masthead-logo {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
      text-decoration: none;
    }

    .masthead-overline {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
    }

    /* ── Main content area ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 12px;
      min-height: 0; /* allow flex child to shrink below content size */
    }

    /* ── Label above textarea ── */
    .input-label {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    /* ── Braindump textarea ── */
    .braindump-textarea {
      flex: 1;
      width: 100%;
      min-height: 0; /* required for flex shrink */
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.65;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      border-radius: 0; /* newspaper aesthetic — no rounding */
    }

    .braindump-textarea:focus {
      border-color: var(--ink);
    }

    .braindump-textarea::placeholder {
      color: var(--ink-muted);
      font-style: italic;
    }

    /* ── CTA button ── */
    .cta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 10px;
      flex-shrink: 0;
    }

    .cta-button {
      display: block;
      width: 100%;
      background: var(--ink);
      color: var(--bg);
      border: 1px solid var(--ink);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 15px 28px;
      cursor: pointer;
      transition: opacity 0.15s;
      -webkit-appearance: none;
      border-radius: 0;
      text-align: center;
      min-height: 48px; /* meets tap target guidelines */
    }

    .cta-button:hover,
    .cta-button:focus-visible {
      opacity: 0.82;
    }

    .cta-button:active {
      opacity: 0.65;
    }

    /* ── Footer hint ── */
    .footer-hint {
      font-family: var(--sans);
      font-size: 11px;
      color: var(--ink-muted);
      text-align: center;
      padding: 8px 20px 12px;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }

    /* ── Mobile adjustments ── */
    @media (max-width: 480px) {
      .masthead { padding: 12px 16px 10px; }
      .main { padding: 12px 16px 10px; }
      .braindump-textarea { font-size: 14px; }
      .footer-hint { padding-bottom: 10px; }
    }

    /* ── Wider viewports: constrain to a readable column ── */
    @media (min-width: 769px) {
      .masthead {
        padding: 16px 40px 14px;
      }
      .page-inner {
        max-width: 760px;
        margin: 0 auto;
        width: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .main {
        flex: 1;
        min-height: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Apply saved theme immediately to avoid flash of wrong theme -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <div class="page">

    <header class="masthead">
      <a class="masthead-logo" href="/">Specview</a>
      <span class="masthead-overline">Engineering Specs from Braindumps</span>
    </header>

    <!-- On wide screens, constrain content width to readable column -->
    <div class="page-inner">

      <main class="main">
        <div class="input-label">Your braindump</div>
        <textarea
          id="braindump-textarea"
          class="braindump-textarea"
          placeholder="Paste your braindump here — messy is fine…"
          aria-label="Braindump text. Type your idea or watch a demo."
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
        ></textarea>
        <div class="cta-row">
          <button id="cta-button" class="cta-button" type="button">
            Analyze this
          </button>
        </div>
      </main>

    </div><!-- .page-inner -->

    <footer class="footer-hint" aria-hidden="true">
      Watch a demo — or start typing your own idea
    </footer>

  </div><!-- .page -->

  <!-- Load scripts in dependency order, then initialize on DOMContentLoaded -->
  <script src="demo-content.js"></script>
  <script src="rotation.js"></script>
  <script src="redirect.js"></script>
  <script>
    // APP_ORIGIN: override this on production to point at app.specview.dev.
    // On localhost, falls back to window.location.origin (same origin as landing).
    window.APP_ORIGIN = window.APP_ORIGIN || 'https://app.specview.dev';

    document.addEventListener('DOMContentLoaded', function () {
      window.initCtaButton();
      window.startRotation();
    });
  </script>

</body>
</html>
