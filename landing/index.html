<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specview — Engineering Specs from Braindumps</title>

  <meta name="description" content="Turn your braindump into a full engineering spec set in under a minute.">
  <meta property="og:title" content="Specview — Engineering Specs from Braindumps">
  <meta property="og:description" content="Turn your braindump into a full engineering spec set in under a minute.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tokens.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
    }

    /* ── Hero section — original minimal aesthetic ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 80px 40px;
      max-width: 760px;
      margin: 0 auto;
    }

    .hero-overline {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 16px;
    }

    .hero-headline {
      font-family: var(--serif);
      font-size: 56px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .hero-subline {
      font-family: var(--body);
      font-size: 18px;
      line-height: 1.75;
      color: var(--ink-light);
      margin-bottom: 36px;
      max-width: 520px;
    }

    /* ── Braindump textarea ── */
    .braindump-textarea {
      width: 100%;
      height: 240px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.65;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      border-radius: 0;
      margin-bottom: 16px;
    }

    .braindump-textarea:focus {
      border-color: var(--ink);
    }

    .braindump-textarea::placeholder {
      color: var(--ink-muted);
      font-style: italic;
    }

    /* ── CTA button — same style as original hero-cta ── */
    .hero-cta {
      display: inline-block;
      background: var(--ink);
      color: var(--bg);
      border: 1px solid var(--ink);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 15px 36px;
      cursor: pointer;
      transition: opacity 0.15s;
      -webkit-appearance: none;
      border-radius: 0;
      text-decoration: none;
      min-height: 48px;
    }

    .hero-cta:hover,
    .hero-cta:focus-visible {
      opacity: 0.82;
    }

    .hero-cta:active {
      opacity: 0.65;
    }

    /* ── Mobile adjustments ── */
    @media (max-width: 768px) {
      .hero {
        padding: 60px 24px;
      }
      .hero-headline {
        font-size: 36px;
      }
      .hero-subline {
        font-size: 16px;
      }
      .braindump-textarea {
        height: 200px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Apply saved theme immediately to avoid flash of wrong theme -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <div class="hero">
    <span class="hero-overline">Specview</span>
    <h1 class="hero-headline">Write messy.<br>Ship clean.</h1>
    <p class="hero-subline">
      Paste your braindump. Five engineering documents back in under a minute.
    </p>

    <textarea
      id="braindump-textarea"
      class="braindump-textarea"
      placeholder="Paste your braindump here — messy is fine…"
      aria-label="Braindump text. Type your idea or watch a demo."
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
    ></textarea>

    <button id="cta-button" class="hero-cta" type="button">
      Generate specs
    </button>
  </div>

  <!-- Load scripts in dependency order, then initialize on DOMContentLoaded -->
  <script src="demo-content.js"></script>
  <script src="rotation.js"></script>
  <script src="redirect.js"></script>
  <script>
    window.APP_ORIGIN = window.APP_ORIGIN || 'https://app.specview.dev';

    document.addEventListener('DOMContentLoaded', function () {
      window.initCtaButton();
      window.startRotation();
    });
  </script>

</body>
</html>
