<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specview — Engineering Specs from Braindumps</title>

  <meta name="description" content="Turn your braindump into a full engineering spec set in under a minute.">
  <meta property="og:title" content="Specview — Engineering Specs from Braindumps">
  <meta property="og:description" content="Turn your braindump into a full engineering spec set in under a minute.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tokens.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
    }

    /* ── Hero section — original minimal aesthetic ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 80px 40px;
      max-width: 760px;
      margin: 0 auto;
    }

    .hero-overline {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
    }

    .hero-headline {
      font-family: var(--serif);
      font-size: 56px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .hero-subline {
      font-family: var(--body);
      font-size: 18px;
      line-height: 1.75;
      color: var(--ink-light);
      margin-bottom: 36px;
      max-width: 520px;
    }

    /* ── Braindump textarea ── */
    .braindump-textarea {
      width: 100%;
      height: 240px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.65;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      border-radius: 0;
      margin-bottom: 16px;
    }

    .braindump-textarea:focus {
      border-color: var(--ink);
    }

    .braindump-textarea::placeholder {
      color: var(--ink-muted);
      font-style: italic;
    }

    /* ── CTA button — same style as original hero-cta ── */
    .hero-cta {
      display: inline-block;
      background: var(--ink);
      color: var(--bg);
      border: 1px solid var(--ink);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 15px 36px;
      cursor: pointer;
      transition: opacity 0.15s;
      -webkit-appearance: none;
      border-radius: 0;
      text-decoration: none;
      min-height: 48px;
    }

    .hero-cta:hover,
    .hero-cta:focus-visible {
      opacity: 0.82;
    }

    .hero-cta:active {
      opacity: 0.65;
    }

    /* ── Top bar ── */
    .hero-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 16px;
    }

    /* ── Theme toggle ── */
    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--ink-light);
      font-size: 18px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s;
      border-radius: 0;
    }

    .theme-toggle:hover {
      opacity: 0.7;
    }

    /* ── Loading indicator ── */
    .analyze-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-light);
    }

    .analyze-loading-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: analyze-spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes analyze-spin {
      to { transform: rotate(360deg); }
    }

    /* ── Error message ── */
    .analyze-error {
      margin-top: 14px;
      font-family: var(--body);
      font-size: 14px;
      color: var(--red);
      line-height: 1.5;
    }

    /* ── Mobile adjustments ── */
    @media (max-width: 768px) {
      .hero {
        padding: 60px 24px;
      }
      .hero-headline {
        font-size: 36px;
      }
      .hero-subline {
        font-size: 16px;
      }
      .braindump-textarea {
        height: 200px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Apply saved theme immediately to avoid flash of wrong theme -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <div class="hero">
    <div class="hero-topbar">
      <span class="hero-overline">Specview</span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="theme-toggle-icon" id="theme-toggle-icon">◑</span>
      </button>
    </div>
    <h1 class="hero-headline">Write messy.<br>Ship clean.</h1>
    <p class="hero-subline">
      Paste your braindump. Five engineering documents back in under a minute.
    </p>

    <textarea
      id="braindump-textarea"
      class="braindump-textarea"
      placeholder="Paste your braindump here — messy is fine…"
      aria-label="Braindump text. Type your idea or watch a demo."
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
    ></textarea>

    <button id="cta-button" class="hero-cta" type="button">
      Generate specs
    </button>

    <!-- Loading indicator (hidden until POST is in flight) -->
    <div id="analyze-loading" class="analyze-loading" hidden>
      <div class="analyze-loading-spinner" aria-hidden="true"></div>
      <span>Starting analysis…</span>
    </div>

    <!-- Error message (hidden until an error occurs) -->
    <div id="analyze-error" class="analyze-error" role="alert" hidden></div>
  </div>

  <!-- Load scripts in dependency order, then initialize on DOMContentLoaded -->
  <script src="demo-content.js"></script>
  <script src="rotation.js"></script>
  <script src="redirect.js"></script>
  <script src="analyze.js"></script>
  <script>
    // In production (specview.dev), APP_ORIGIN should be set to https://app.specview.dev
    // via the nginx config or an env-injected script. In local dev, fall back to
    // localhost:4200 (Angular dev server) so the CTA redirect works locally.
    window.APP_ORIGIN = window.APP_ORIGIN ||
      (window.location.hostname === 'localhost'
        ? 'http://localhost:4200'
        : 'https://app.specview.dev');

    document.addEventListener('DOMContentLoaded', function () {
      window.initCtaButton();
      window.startRotation();

      // Dark mode toggle
      var toggleBtn = document.getElementById('theme-toggle');
      var toggleIcon = document.getElementById('theme-toggle-icon');
      function updateIcon() {
        var current = document.documentElement.getAttribute('data-theme');
        toggleIcon.textContent = current === 'dark' ? '☀' : '◑';
      }
      updateIcon();
      toggleBtn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateIcon();
      });
    });
  </script>

</body>
</html>
