# Integration seam — specview's GUI on the standalone oll-core (C1).
#
# The browser stays SAME-ORIGIN (/api/*). nginx splits the surface:
#   /api/auth|billing|email/*  → oll-core  (the frozen infrastructure service)
#   /api/* (everything else)   → specview api  (product: projects/context/ai/…)
#
# Frontend code is unchanged and there is NO CORS — the lowest-touch way to run
# specview as Core's first HTTP client. SSO works because Core and specview share
# AUTH_JWT_SECRET (same signing key) and the oll_core DB (same user rows), so a
# Core-issued JWT validates in specview's product routes with no extra wiring.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS — re-resolve service IPs so the SPA still boots if a
  # backend restarts.
  resolver 127.0.0.11 valid=10s;

  # Core owns auth, billing and email. Regex location wins over the /api/ prefix
  # below. proxy_pass carries NO path, so the full original URI is forwarded
  # (e.g. /api/auth/verify → core.oll.am/api/auth/verify).
  location ~ ^/api/(auth|billing|email)/ {
    # C2: specview is Core's first client against the DEPLOYED Core — the public
    # https://core.oll.am, not the local oll-core container. This proves the
    # deployed Core is a real drop-in over the internet + TLS.
    proxy_pass https://core.oll.am;
    # TLS to a public upstream: send SNI + verify against the system CA bundle so
    # the Let's Encrypt cert matches. Host must be core.oll.am (not $host) or the
    # cert/SNI won't line up.
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host core.oll.am;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Everything else under /api/ is specview's product backend.
  location /api/ {
    proxy_pass http://api:3101/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
