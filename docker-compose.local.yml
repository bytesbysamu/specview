# Local validation stack for the specview Core (NOT for production).
#
# Why this file (and not the root docker-compose.yml): the committed root
# compose is the Coolify production deploy (web/api/landing, APP_ENV=production,
# external Neon DATABASE_URL). This file runs the Core against a throwaway
# local Postgres with safe dev-only secrets, so the container can be validated
# (alembic migrations + API boot) before deploying. No live secrets here.
#
#   docker compose -f docker-compose.local.yml up -d --build
#   curl localhost:3198/api/health
#
# Build context is the repo root (.) — api/Dockerfile COPYs api/, plugin/, and
# data/ which are all relative to the repo root, so context MUST be `.`.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: corepass
      POSTGRES_DB: ollcore
    volumes:
      - specview_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d ollcore"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3198:3101"
    environment:
      # Point at the local db service — NEVER live Neon. psycopg2-binary is the
      # installed driver, so the URL uses the +psycopg2 scheme (psycopg v3 is
      # not installed).
      DATABASE_URL: postgresql+psycopg2://core:corepass@db:5432/ollcore
      # Hard-required by the secret boot gate (create_app._enforce_secret_boot_gate).
      AUTH_JWT_SECRET: dev-secret-for-local-only
      STRIPE_WEBHOOK_SECRET: whsec_dev_dummy
      # Stripe / email intentionally off for local validation.
      STRIPE_SECRET_KEY: ""
      RESEND_API_KEY: ""
      # Mock chain provider — no Anthropic key needed, AI calls are stubbed.
      CHAIN_PROVIDER: mock
      FRONTEND_URL: http://localhost:4200
      # Keep filesystem/config paths consistent with the image layout
      # (Dockerfile copies data/ -> /data/spec-doc).
      SPEC_DOC_DIR: /data/spec-doc
      # NOTE: APP_ENV deliberately NOT set to production (keeps boot gate in
      # warn-mode and avoids the prod startup gate).
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3101/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  specview_local_pgdata:
