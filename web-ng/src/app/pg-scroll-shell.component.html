<!-- ── Playground V4 Scroll Shell ──────────────────────────────────────────── -->
<!-- All sections always render in the DOM.                                    -->
<!-- A single IntersectionObserver (threshold 0.1) adds `revealed` to each   -->
<!-- section wrapper as its top edge enters the viewport.                     -->
<!-- CSS transitions handle the fade-in — no JavaScript content gating.       -->
<div class="pg-shell" [attr.data-theme]="isDark() ? 'dark' : null">
  <div class="pg-shell__content">

    <!-- ── Section 0: Greeting ────────────────────────────────────────────── -->
    <div
      class="pg-section pg-reveal-target"
      data-section-id="greeting"
      data-test="section-greeting"
      #sectionEl
    >
      <div class="pg-section__body">
        <app-pg-section-greeting />
      </div>

      <!-- Scroll-down affordance: subtle bottom border opacity shift -->
      <div class="pg-shell__scroll-hint pg-shell__scroll-hint--visible"></div>
    </div>

    <!-- ── Before/After Transformation Section ──────────────────────────────── -->
    <!-- Not part of the five-section gating inventory.                          -->
    <!-- The shell observer handles its reveal; right column uses pg-reveal-target. -->
    <div
      class="pg-section pg-reveal-target"
      data-section-id="before-after"
      data-test="section-before-after"
      #sectionEl
    >
      <div class="pg-section__body">
        <app-pg-section-before-after />
      </div>
    </div>

    <!-- ── Section 1: Kitchen ───────────────────────────────────────────────── -->
    <div
      class="pg-section pg-reveal-target"
      data-section-id="kitchen"
      data-test="section-kitchen"
      #sectionEl
    >
      <div class="pg-section__body">
        <app-pg-section-kitchen
          (seeItLive)="onKitchenSeeItLive()"
        />
      </div>
    </div>

    <!-- ── Section 2: Main Course ───────────────────────────────────────────── -->
    <div
      class="pg-section pg-reveal-target"
      data-section-id="main-course"
      data-test="section-main-course"
      #mainCourseSection
      #sectionEl
    >
      <div class="pg-section__body">
        <app-pg-section-live-app
          [isDark]="isDark()"
          [activation]="liveAppActivation()"
          (themeToggled)="toggleTheme()"
        />
      </div>
    </div>

    <!-- ── Section 3a: Presentation — Tokens & Borders (hidden) ─────────── -->
    <!-- <div
      class="pg-section pg-reveal-target"
      data-section-id="presentation"
      data-test="section-presentation"
      #sectionEl
    >
      <div class="pg-section__body">
        <app-pg-section-patterns [page]="1" />
      </div>
    </div> -->

    <!-- ── Section 3b: Presentation — Motion & Interactions (hidden) ──────── -->
    <!-- <div
      class="pg-section pg-reveal-target"
      data-section-id="presentation-2"
      data-test="section-presentation-2"
      #sectionEl
    >
      <div class="pg-section__body">
        <app-pg-section-patterns [page]="2" />
      </div>
    </div> -->

    <!-- ── Section 4: Send-Off ──────────────────────────────────────────────── -->
    <div
      class="pg-section pg-reveal-target"
      data-section-id="send-off"
      data-test="section-send-off"
      #sectionEl
    >
      <div class="pg-section__body">
        <app-pg-section-sendoff
        [ctaLabel]="'Get started free'"
        (ctaClick)="onCtaClick()" />
      </div>
    </div>

  </div><!-- /.pg-shell__content -->
</div><!-- /.pg-shell -->
