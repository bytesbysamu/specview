name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Stage 0 — detect changed paths ───────────────────────────────────────

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'api/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'web-ng/**'
              - 'api/openapi.yaml'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  compose-lint:
    name: Compose config lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No localhost in healthchecks
        run: |
          # localhost in a container resolves to ::1 (IPv6), but gunicorn/nginx
          # bind to 0.0.0.0 (IPv4 only) — healthchecks silently fail. Use 127.0.0.1.
          if grep -n 'test:' docker-compose.yml | grep -q 'localhost'; then
            echo "ERROR: healthcheck uses 'localhost' — use '127.0.0.1' instead (IPv6 resolution breaks in-container checks)"
            grep -n 'test:' docker-compose.yml | grep 'localhost'
            exit 1
          fi
          echo "OK: no localhost in healthchecks"

  # ── Stage 1 — backend and frontend tracks run in parallel, independently ──

  backend:
    name: Backend — lint + test
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pytest pytest-cov ruff
      - name: Generate Python DTOs
        run: |
          python -m datamodel_code_generator \
            --input openapi.yaml \
            --output dtos/models.py \
            --output-model-type pydantic_v2.BaseModel \
            --input-file-type openapi \
            --target-python-version 3.10 \
            --disable-timestamp
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          CHAIN_PROVIDER: mock
        run: |
          set -o pipefail
          python -m pytest \
            --cov=modules \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            -v 2>&1 | tee pytest-output.txt
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            api/coverage.xml
            api/htmlcov/
          retention-days: 14
      - name: Upload test output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-output
          path: api/pytest-output.txt
          retention-days: 7

  frontend:
    name: Frontend — lint + test + build
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-ng
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ng/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false --legacy-peer-deps
      - name: Generate Angular API client
        run: npm run generate:api
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI --code-coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: web-ng/coverage/
          retention-days: 14
      - name: Build (production)
        run: npm run build -- --configuration production

  # ── Stage 2 — integration (gates on both tracks) ──────────────────────────

  e2e:
    name: E2E tests
    needs: [backend, frontend]
    if: false  # Temporarily disabled — pre-existing failures since PR #89
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install Python dependencies (API + E2E)
        run: |
          pip install -r api/requirements.txt \
                      -r e2e/requirements.txt \
                      datamodel-code-generator==0.45.0
      - name: Generate Python DTOs
        run: |
          python -m datamodel_code_generator \
            --input api/openapi.yaml \
            --output api/dtos/models.py \
            --output-model-type pydantic_v2.BaseModel \
            --input-file-type openapi \
            --target-python-version 3.10 \
            --disable-timestamp
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ng/package-lock.json
      - name: Install Node dependencies
        working-directory: web-ng
        run: npm ci --prefer-offline --no-audit --progress=false --legacy-peer-deps
      - name: Generate Angular API client
        working-directory: web-ng
        run: npm run generate:api
      - name: Run E2E tests
        env:
          CHAIN_PROVIDER: mock
          PYTHONPATH: .
        run: |
          set -o pipefail
          python -m pytest e2e/ \
            --tb=short \
            -v \
            2>&1 | tee e2e-output.txt
      - name: Upload E2E output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-output
          path: e2e-output.txt
          retention-days: 7

  # ── Stage 3 — docker build + smoke ───────────────────────────────────────

  docker:
    name: Docker build & smoke
    needs: [backend, frontend, compose-lint]
    if: >-
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      needs.compose-lint.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHAIN_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build
      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
      - name: Wait — API health (host→port 3101)
        run: |
          for i in $(seq 1 24); do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
              http://localhost:3101/api/health 2>/dev/null || echo "000")
            echo "attempt $i/24: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 5
          done
          echo "API health check failed after 120s"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs api
          exit 1
      - name: Verify container health status
        run: |
          # Confirm each container's built-in healthcheck reports 'healthy'.
          # This catches IPv6/IPv4 mismatches and other in-container failures
          # that host-side port checks can't detect.
          for i in $(seq 1 18); do
            ALL_HEALTHY=true
            for svc in api web landing; do
              CID=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -q "$svc" 2>/dev/null)
              STATUS=$(docker inspect "$CID" --format '{{.State.Health.Status}}' 2>/dev/null || echo "missing")
              echo "${svc}: ${STATUS}"
              [ "$STATUS" = "healthy" ] || ALL_HEALTHY=false
            done
            $ALL_HEALTHY && echo "All containers healthy" && exit 0
            sleep 5
          done
          echo "FAIL: not all containers healthy after 90s"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          exit 1
      - name: Smoke — /api/health returns status field
        run: |
          BODY=$(curl -sf http://localhost:3101/api/health)
          echo "$BODY"
          echo "$BODY" | grep -q '"status"' \
            || (echo "FAIL: missing status field" && exit 1)
      - name: Smoke — nginx proxies /api/health (host→port 8080)
        run: |
          BODY=$(curl -sf http://localhost:8080/api/health)
          echo "$BODY"
          echo "$BODY" | grep -q '"status"' \
            || (echo "FAIL: nginx→Flask proxy failed" && exit 1)
      - name: Smoke — GET / serves Angular SPA
        run: |
          BODY=$(curl -sf http://localhost:8080/)
          echo "$BODY" | head -3
          echo "$BODY" | grep -qi "<!doctype html>" \
            || (echo "FAIL: / did not serve Angular HTML" && exit 1)
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ── Stage 4 — auto-merge (gates on docker) ────────────────────────────────

  auto-merge:
    name: Auto-merge PR
    needs: [docker]
    if: >-
      always() &&
      needs.docker.result == 'success' &&
      github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list \
            --repo ${{ github.repository }} \
            --head ${{ github.ref_name }} \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open PR found for this branch — skipping"
            exit 0
          fi
          echo "Merging PR #$PR"
          gh pr merge --squash "$PR" --repo ${{ github.repository }}
