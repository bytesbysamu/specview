name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1 (parallel) — lint ─────────────────────────────────────────────

  lint-backend:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  lint-frontend:
    name: TypeScript lint (ng lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web-ng

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ng/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false --legacy-peer-deps

      - name: Lint
        run: npm run lint

  # ── Stage 2 (parallel, gates on lint) ────────────────────────────────────

  backend:
    name: Backend tests
    needs: [lint-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run tests with coverage
        env:
          CHAIN_PROVIDER: mock
        run: |
          python -m pytest \
            --cov=modules \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            -v 2>&1 | tee pytest-output.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            api/coverage.xml
            api/htmlcov/
          retention-days: 14

      - name: Upload test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-output
          path: api/pytest-output.txt
          retention-days: 7

  frontend:
    name: Frontend tests
    needs: [lint-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web-ng

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ng/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false --legacy-peer-deps

      - name: Unit tests (ChromeHeadlessCI)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Build (production)
        run: npm run build -- --configuration production

  # ── Stage 3 (parallel, gates on stage 2) ─────────────────────────────────

  docker:
    name: Docker build & smoke
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHAIN_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Wait — API health (host→port 3101)
        run: |
          for i in $(seq 1 24); do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
              http://localhost:3101/api/health 2>/dev/null || echo "000")
            echo "attempt $i/24: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 5
          done
          echo "API health check failed after 120s"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs api
          exit 1

      - name: Smoke — /api/health returns status field
        run: |
          BODY=$(curl -sf http://localhost:3101/api/health)
          echo "$BODY"
          echo "$BODY" | grep -q '"status"' \
            || (echo "FAIL: missing status field" && exit 1)

      - name: Smoke — nginx proxies /api/health (host→port 8080)
        run: |
          BODY=$(curl -sf http://localhost:8080/api/health)
          echo "$BODY"
          echo "$BODY" | grep -q '"status"' \
            || (echo "FAIL: nginx→Flask proxy failed" && exit 1)

      - name: Smoke — GET / serves Angular SPA
        run: |
          BODY=$(curl -sf http://localhost:8080/)
          echo "$BODY" | head -3
          echo "$BODY" | grep -qi "<!doctype html>" \
            || (echo "FAIL: / did not serve Angular HTML" && exit 1)

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  e2e:
    name: E2E tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install Python dependencies (API + E2E)
        run: |
          pip install -r api/requirements.txt
          pip install -r e2e/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ng/package-lock.json

      - name: Install Node dependencies
        working-directory: web-ng
        run: npm ci --prefer-offline --no-audit --progress=false --legacy-peer-deps

      - name: Run E2E tests
        env:
          CHAIN_PROVIDER: mock
          PYTHONPATH: .
        run: |
          python -m pytest e2e/ \
            --tb=short \
            -v \
            2>&1 | tee e2e-output.txt

      - name: Upload E2E output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: e2e-output.txt
          retention-days: 7

  # deploy job — add here when ready; trigger on master push, needs: [docker, e2e]
