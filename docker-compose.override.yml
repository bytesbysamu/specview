services:
  web:
    ports:
      - "8095:80"

  landing:
    ports:
      - "8096:80"

  api:
    environment:
      CHAIN_PROVIDER: cli
      CHAIN_AGENT: chain-agent
      SPEC_DOC_DIR: /data/spec-doc
      PLUGIN_DIR: /app/plugin
      CORS_ORIGINS: "http://localhost:4200,http://localhost:8095"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID}
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8095}"
    volumes:
      - claude-credentials:/home/appuser/.claude
      - /Users/sam/.claude-openclaw:/home/appuser/.claude-openclaw
      - /Users/sam/Projects/specview/data:/data/spec-doc
      - /Users/sam/Projects/specview/plugin:/app/plugin:ro
      - /Users/sam/Projects:/home/appuser/projects:ro

volumes:
  claude-credentials:
