services:
  web:
    ports:
      - "8095:80"

  landing:
    ports:
      - "8096:80"

  api:
    environment:
      CHAIN_PROVIDER: cli
    volumes:
      - /Users/sam/.claude:/home/appuser/.claude
      - /Users/sam/.claude-openclaw:/home/appuser/.claude-openclaw
      - /Users/sam/.claude.json:/home/appuser/.claude.json
