services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: production
      SPEC_DOC_DIR: /data/spec-doc
      CHAIN_PROVIDER: ${CHAIN_PROVIDER:-cli}
      DATABASE_URL: ${DATABASE_URL}
      # Auth — hardened Core boot-gate requires a JWT secret (accepts JWT_SECRET as legacy alias)
      JWT_SECRET: ${JWT_SECRET}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-${JWT_SECRET}}
      # Billing — Core boot-gate also requires STRIPE_WEBHOOK_SECRET; prod must supply all of these
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID}
      # Email (optional — empty disables sending gracefully)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - claude-credentials:/home/appuser/.claude
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3101/api/health/anthropic"]
      interval: 300s
      timeout: 30s
      retries: 2
      start_period: 120s
    restart: unless-stopped

  landing:
    build:
      context: landing
      dockerfile: Dockerfile
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  claude-credentials:
