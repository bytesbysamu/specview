services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      SPEC_DOC_DIR: /data/spec-doc
      SKIP_AUTH: "1"
      CHAIN_PROVIDER: cli
      DATABASE_URL: ""
      CORS_ORIGINS: "*"
    volumes:
      - ${SPECVIEW_DATA_DIR:-/opt/specview/data}:/data/spec-doc
    restart: unless-stopped
