services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - specview

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: production
      SPEC_DOC_DIR: /data/spec-doc
      CHAIN_PROVIDER: ${CHAIN_PROVIDER:-cli}
      DATABASE_URL: "postgresql://neondb_owner:npg_7koHUOnPFp3E@ep-lively-feather-agg1dzjp-pooler.c-2.eu-central-1.aws.neon.tech/neondb?sslmode=require"
      JWT_SECRET: "ef65adfbc50572d85b346a0cb5791ccc577fd4ec6a91a018a5b994a92ff40405"
      CORS_ORIGINS: "*"
    volumes:
      - claude-credentials:/home/appuser/.claude
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3101/api/health/anthropic"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - specview

  landing:
    build:
      context: landing
      dockerfile: Dockerfile
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - specview

networks:
  specview:
    driver: bridge

volumes:
  claude-credentials:
