services:
  web:
    image: nginx:alpine
    ports:
      - "8095:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: spec-doc-api
    environment:
      APP_ENV: development
      SPEC_DOC_DIR: /data/spec-doc
      SKIP_AUTH: "1"
      CHAIN_PROVIDER: cli
      DATABASE_URL: ""
      CORS_ORIGINS: "http://localhost:8090"
    volumes:
      - /Users/sam/Projects/spec-doc-data:/data/spec-doc
    restart: unless-stopped
