services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - specview

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: production
      SPEC_DOC_DIR: /data/spec-doc
      CHAIN_PROVIDER: ${CHAIN_PROVIDER:-cli}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - claude-credentials:/home/appuser/.claude
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3101/api/health/anthropic"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - specview

  landing:
    build:
      context: landing
      dockerfile: Dockerfile
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - specview

networks:
  specview:
    driver: bridge

volumes:
  claude-credentials:
