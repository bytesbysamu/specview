services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - specview

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: production
      SPEC_DOC_DIR: /data/spec-doc
      SKIP_AUTH: "1"
      CHAIN_PROVIDER: cli
      DATABASE_URL: ""
      CORS_ORIGINS: "*"
    restart: unless-stopped
    networks:
      - specview

networks:
  specview:
    driver: bridge
