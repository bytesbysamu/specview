services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - specview

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: production
      SPEC_DOC_DIR: /data/spec-doc
      CHAIN_PROVIDER: ${CHAIN_PROVIDER:-cli}
      DATABASE_URL: "postgresql://neondb_owner:npg_7koHUOnPFp3E@ep-lively-feather-agg1dzjp-pooler.c-2.eu-central-1.aws.neon.tech/neondb?sslmode=require"
      JWT_SECRET: "ef65adfbc50572d85b346a0cb5791ccc577fd4ec6a91a018a5b994a92ff40405"
      CORS_ORIGINS: "*"
    restart: unless-stopped
    networks:
      - specview

  landing:
    build:
      context: landing
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - specview

networks:
  specview:
    driver: bridge
