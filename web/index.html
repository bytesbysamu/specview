<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

    <!-- Masthead -->
    <header class="masthead">
      <div class="masthead-top">
        <span class="edition" id="edition">Spec Doc</span>
        <div class="masthead-center">
          <div class="masthead-date" id="masthead-date"></div>
          <h1 class="masthead-title">Specview</h1>
          <div class="masthead-tagline">All the Specs Fit to Read</div>
        </div>
        <div class="masthead-actions">
          <button id="theme-toggle" title="Toggle dark mode">☀️</button>
        </div>
      </div>
    </header>

    <!-- Project Nav -->
    <nav class="section-nav" id="project-nav">
      <span class="section-link muted">Loading projects…</span>
    </nav>

    <div class="divider thick"></div>

    <!-- File grid -->
    <section class="file-grid" id="file-grid">
      <div class="empty-state">Select a project above</div>
    </section>

    <!-- Expanded file panel -->
    <div class="expanded-panel" id="expanded-panel">
      <div class="expanded-header">
        <div class="expanded-meta">
          <span class="expanded-project" id="expanded-project"></span>
          <span class="expanded-file" id="expanded-file"></span>
        </div>
        <button class="expanded-close" id="expanded-close">×</button>
      </div>
      <div class="expanded-tabs" id="expanded-tabs" style="display:none"></div>
      <h2 class="expanded-title" id="expanded-title"></h2>
      <div class="expanded-body markdown-content" id="expanded-body"></div>
    </div>

    <footer class="footer">
      <div class="divider thick"></div>
      <p>Specview · powered by spec-doc</p>
    </footer>

  </div>
  <script src="app.js"></script>
</body>
</html>
