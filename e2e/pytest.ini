[pytest]
bdd_features_base_dir = features
markers =
    e2e: browser-driven; requires the dev server to be running
    overview: overview page feature scenarios
    detail: project detail page feature scenarios
    saas: SaaS / billing feature scenarios
    smoke: critical path smoke tests (subset of overview)
    OV-01: auth gate scenarios
    OV-02: masthead scenarios
    OV-03: section tab navigation scenarios
    OV-04: section count badge animation scenarios
    OV-05: generation status bar scenarios
    OV-06: update banner scenarios
    OV-07: search and filter bar scenarios
    OV-08: project grid and card rendering scenarios
    OV-09: active project card teaser scenarios
    OV-10: background polling lifecycle scenarios
    OV-11: dark mode persistence (polling file) scenarios
    OV-12: dark mode toggle scenarios
    OV-13: create project modal scenarios
    PD-01: spec-gen pipeline lifecycle
    PD-02: reader panel open on project select
    PD-03: sidebar file click loads reader content
    PD-04: sidebar status row connection state
    PD-05: per-file dot tracking
    PD-06: generate specs button trigger
    PD-07: generate guide button trigger
    PD-08: AI text operation chips
    PD-09: style preset chips
    PD-10: AI result panel diff view
    PD-11: apply copy dismiss toolbar
    PD-12: undo redo stack
    PD-13: brainstorm follow-up input
    PD-14: generate specs from brainstorm
    PD-15: sidebar file canonical ordering
    PD-16: markdown rendering and XSS sanitisation
    SKIP_MOCK: scenarios requiring mock provider (skipped on Docker)
    SA-01: login page flow
    SA-02: signup registration flow
    SA-03: auth service (implicit via login)
    SA-04: token lifecycle and expiry redirect
    SA-05: auth HTTP interceptor (implicit via token)
    SA-06: project ownership 403 isolation
    SA-07: subscription service (implicit via billing)
    SA-08: billing interceptor 429 redirect
    SA-09: usage remaining header display
    SA-10: usage meter visibility per plan
    SA-11: upgrade button masthead visibility
    SA-12: upgrade page per plan state
    SA-13: full-page route rendering
    SA-20: lapsed plan call-to-action
    SA-21: Stripe checkout redirect
