[pytest]
bdd_features_base_dir = features
markers =
    e2e: browser-driven; requires the dev server to be running
    overview: overview page feature scenarios
    smoke: critical path smoke tests (subset of overview)
    OV-01: auth gate scenarios
    OV-02: masthead scenarios
    OV-03: section tab navigation scenarios
    OV-04: section count badge animation scenarios
    OV-05: generation status bar scenarios
    OV-06: update banner scenarios
    OV-07: search and filter bar scenarios
    OV-08: project grid and card rendering scenarios
    OV-09: active project card teaser scenarios
    OV-10: background polling lifecycle scenarios
    OV-11: dark mode persistence (polling file) scenarios
    OV-12: dark mode toggle scenarios
    OV-13: create project modal scenarios
